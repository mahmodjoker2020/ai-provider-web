<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ai provider — وكيل الأوردرات الذكي</title>
  <style>
    * { box-sizing: border-box; font-family: Tahoma, Arial, sans-serif; }
    body {
      margin: 0;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    .app {
      width: 100%;
      max-width: 520px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
    }
    .header {
      background: #0b1120;
      padding: 16px 18px;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .header h1 {
      margin: 0;
      font-size: 18px;
      color: #38bdf8;
    }
    .header p {
      margin: 4px 0 0;
      font-size: 12px;
      color: #94a3b8;
    }
    .badge {
      background: #0f172a;
      border: 1px solid #38bdf8;
      color: #7dd3fc;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      white-space: nowrap;
    }
    .chat-box {
      height: 390px;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      padding: 11px 14px;
      border-radius: 12px;
      max-width: 86%;
      line-height: 1.6;
      font-size: 14px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .msg.bot {
      background: #0f172a;
      border: 1px solid #334155;
      align-self: flex-start;
      color: #e2e8f0;
    }
    .msg.user {
      background: #0284c7;
      align-self: flex-end;
      color: #ffffff;
    }
    .msg.system {
      background: #312e81;
      border: 1px solid #6366f1;
      align-self: center;
      text-align: center;
      font-size: 13px;
      max-width: 95%;
    }
    .wa-btn {
      display: inline-block;
      margin-top: 8px;
      background: #16a34a;
      color: #fff;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 13px;
    }
    .input-area {
      display: flex;
      gap: 8px;
      padding: 12px;
      background: #0b1120;
      border-top: 1px solid #334155;
    }
    .input-area input {
      flex: 1;
      padding: 11px 13px;
      border-radius: 9px;
      border: 1px solid #475569;
      background: #1e293b;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    .input-area button {
      padding: 11px 18px;
      border: none;
      border-radius: 9px;
      background: #0284c7;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }
    .input-area button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .reset-bar {
      padding: 8px 14px;
      background: #131c31;
      font-size: 11px;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .reset-btn {
      background: transparent;
      border: 1px solid #475569;
      color: #cbd5e1;
      padding: 3px 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div>
        <h1>ai provider</h1>
        <p>وكيل الأوردرات الذكي — تجربة مجانية (3 أسئلة)</p>
      </div>
      <div class="badge" id="quotaBadge">المتبقي: 3 / 3</div>
    </div>

    <div class="chat-box" id="chatBox">
      <div class="msg bot">أهلاً بك في ai provider 👋
أنا وكيل الأوردرات الذكي. اسألني عن المنتجات والأسعار، أو أخبرني بالطلب الذي تريد تجهيزه الآن.</div>
    </div>

    <form class="input-area" id="chatForm">
      <input type="text" id="userInput" placeholder="اكتب رسالتك أو طلبك هنا..." autocomplete="off" required />
      <button type="submit" id="sendBtn">إرسال</button>
    </form>

    <div class="reset-bar">
      <span>وضع الاختبار المحلي</span>
      <button type="button" class="reset-btn" id="resetQuotaBtn">تصفير عداد التجربة</button>
    </div>
  </div>

  <script type="module" src="./chat.js"></script>
</body>
</html>
